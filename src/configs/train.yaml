defaults:
  - model: asr
  - loss_function: ctc
  - writer: cometml
  - metrics: train
  - datasets: train
  - dataloader: train
  - transforms: train
  - _self_
experiment_name: ds2_ctc_train100_v1
sample_rate: 16000
optimizer:
  _target_: torch.optim.AdamW
  lr: 3e-4
lr_scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: 6e-4
  pct_start: 0.05
  steps_per_epoch: ${trainer.epoch_len}
  epochs: ${trainer.n_epochs}
  anneal_strategy: cos
  cycle_momentum: false
text_encoder:
  _target_: src.text_encoder.TextEncoder
trainer:
  log_step: 100
  n_epochs: 20
  epoch_len: 4096
  max_grad_norm: 400.0
  device_tensors: ["spectrogram", "text_encoded"] # which tensors should be on device (ex. GPU)
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  from_pretrained: null # full checkpoint or state_dict path
  override: false
  monitor: "min val_clean_WER_(Greedy)"
  save_period: 1 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 1
  skip_oom: false
