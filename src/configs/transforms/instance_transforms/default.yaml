train:
  get_spectrogram: # special key for getting spectrogram
    _target_: src.transforms.spec_augs.log_mel.LogMelSpectrogram
    sample_rate: 16000
    n_fft: 512
    win_length: 400
    hop_length: 160
    n_mels: 80
    f_min: 0.0
    f_max: 8000.0
    power: 2.0
    center: true
    mel_scale: htk
    norm: null
    eps: 1.0e-5
  audio: # name of the tensor on which we apply transform
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: src.transforms.wav_augs.Gain
        min_gain_in_db: -6.0
        max_gain_in_db: 6.0
        p: 0.5
inference:
  get_spectrogram:
    _target_: src.transforms.spec_augs.log_mel.LogMelSpectrogram
    sample_rate: 16000
    n_fft: 512
    win_length: 400
    hop_length: 160
    n_mels: 80
    f_min: 0.0
    f_max: 8000.0
    power: 2.0
    center: true
    mel_scale: htk
    norm: null
    eps: 1.0e-5
