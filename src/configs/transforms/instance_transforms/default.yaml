train:
  get_spectrogram: # special key for getting spectrogram
    _target_: src.transforms.spec_augs.log_mel.LogMelSpectrogram
    sample_rate: ${sample_rate}
    n_fft: 512
    win_length: 400
    hop_length: 160
    n_mels: ${model.encoder_factory.n_feats}
    f_min: 0.0
    f_max: null
    power: 2.0
    center: true
    mel_scale: htk
    norm: null
    eps: 1.0e-5
  audio: # name of the tensor on which we apply transform
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: src.transforms.wav_augs.Gain
        min_gain_in_db: -6.0
        max_gain_in_db: 6.0
        p: 0.5
      - _target_: torchvision.transforms.v2.RandomApply
        p: 0.5
        transforms:
          - _target_: src.transforms.wav_augs.SpeedPerturbation
            sample_rate: ${sample_rate}
            factors: [0.9, 0.95, 1.05, 1.1]
      - _target_: torchvision.transforms.v2.RandomApply
        p: 0.2
        transforms:
          - _target_: src.transforms.wav_augs.AddReverb
            sample_rate: ${sample_rate}
            room_size_min: 0.1
            room_size_max: 0.5
            damping_min: 0.3
            damping_max: 0.7
            wet_level_min: 0.05
            wet_level_max: 0.2
            dry_level_min: 0.8
            dry_level_max: 1.0
            width_min: 1.0
            width_max: 1.0
      - _target_: src.transforms.wav_augs.AddColoredNoise
        sample_rate: ${sample_rate}
        min_snr_in_db: 30.0
        max_snr_in_db: 40.0
        min_f_decay: 0.0
        max_f_decay: 1.0
        p: 0.2
  spectrogram:
    _target_: src.transforms.spec_augs.NormalizeSpectrogram
    eps: 1.0e-5
inference:
  get_spectrogram:
    _target_: src.transforms.spec_augs.log_mel.LogMelSpectrogram
    sample_rate: ${sample_rate}
    n_fft: 512
    win_length: 400
    hop_length: 160
    n_mels: ${model.encoder_factory.n_feats}
    f_min: 0.0
    f_max: null
    power: 2.0
    center: true
    mel_scale: htk
    norm: null
    eps: 1.0e-5
  spectrogram:
    _target_: src.transforms.spec_augs.NormalizeSpectrogram
    eps: 1.0e-5
