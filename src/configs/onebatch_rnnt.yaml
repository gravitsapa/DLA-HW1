defaults:
  - onebatch_ctc
  - override model/head@model.head_factory: rnnt
  - override model/decoder@model.decoder_factory: rnnt
  - override loss_function: rnnt
  - _self_

experiment_name: ds2_rnnt_onebatch
model:
  head_factory:
    predictor_factory:
      emb_size: 64
      hidden_size: 128
    joint_hidden_size: 128
  decoder_factory:
    beam_size: 2
    max_symbols_per_step: 2
    max_cache_size: 256
